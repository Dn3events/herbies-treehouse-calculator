<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123b2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Herbie’s Treehouse">
    <meta name="description" content="A cheerful, quick Christmas stall till for Herbie’s Treehouse.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=7">
    <title>Herbie’s Treehouse Calculator</title>
  </head>
  <body>
    <div class="festive-trim" aria-hidden="true"><span class="tinsel tinsel-one"></span><span class="tinsel tinsel-two"></span><span class="bauble bauble-one"></span><span class="bauble bauble-two"></span><span class="bauble bauble-three"></span><span class="bauble bauble-four"></span></div>
    <main class="app" id="main-screen">
      <header class="brand">
        <div class="logo-plaque"><img class="brand-logo" src="treehouse-logo.png" alt="The Treehouse"></div>
        <div class="garland" aria-hidden="true"><span>✦</span><i></i><span>●</span><i></i><span>✦</span><i></i><span>●</span><i></i><span>✦</span></div>
        <p class="tagline">A little festive magic</p>
      </header>

      <section class="products" aria-label="Add an item to the order">
        <button class="product" data-pence="670" data-breakdown="Alcoholic drink" type="button">
          <span class="product-icon" aria-hidden="true">🍷</span><span class="product-name">Alcoholic drink</span><span class="product-price">£6.70</span>
        </button>
        <button class="product" data-pence="470" data-breakdown="Hot drinks" type="button">
          <span class="product-icon" aria-hidden="true">☕</span><span class="product-name">Hot chocolate /<br>Mulled apple /<br>Ginger beer</span><span class="product-price">£4.70</span>
        </button>
        <button class="product" data-pence="520" data-breakdown="Egg nog / chocolate orange" type="button">
          <span class="product-icon" aria-hidden="true">🍊</span><span class="product-name">Egg nog /<br>Chocolate orange</span><span class="product-price">£5.20</span>
        </button>
        <button class="product" data-pence="200" data-breakdown="Shots" type="button">
          <span class="product-icon" aria-hidden="true">🥃</span><span class="product-name">Shots</span><span class="product-price">£2.00</span>
        </button>
        <button class="product" data-pence="720" data-breakdown="Hot toddys" type="button">
          <span class="product-icon" aria-hidden="true">🍋</span><span class="product-name">Hot toddys</span><span class="product-price">£7.20</span>
        </button>
        <button class="product product-extra" type="button" aria-label="Extras, no price set">
          <span class="product-icon" aria-hidden="true">🎁</span><span class="product-name">Extras</span><span class="product-price pending">Price to come</span>
        </button>
      </section>

      <footer class="order-bar">
        <button class="undo" id="undo" type="button" aria-label="Remove the most recently added item" title="Remove last item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
        <button class="clear-button" id="clear" type="button">Clear</button>
        <button class="discount-button" id="trader-discount" type="button" aria-pressed="false"><span class="discount-icon" aria-hidden="true">✦</span><span>Trader<br>50% off</span></button>
        <button class="total-button" id="open-total" type="button" aria-label="Order total £0.00">
          <span class="total-breakdown" id="items-breakdown" aria-label="Order items"><span class="breakdown-empty">No items yet</span></span>
          <span class="total-summary"><span class="total-label">TOTAL</span><span class="total-value" id="total">£0.00</span><span class="total-hint">Tap to celebrate ✨</span></span>
        </button>
      </footer>
    </main>

    <section class="celebration" id="celebration" aria-label="Order total" hidden>
      <div class="star-field" aria-hidden="true"></div>
      <div class="celebration-content"><div class="celebration-total" id="celebration-total">£0.00</div></div>
      <img class="dancing-elves" src="dancing-elves.png" alt="" aria-hidden="true">
      <button class="celebration-clear" id="celebration-clear" type="button">Clear order</button>
    </section>
    <script src="app.js?v=7" defer></script>
  </body>
</html>
